<div style="padding: 32px; background-color: white; border-radius: 1rem; position: relative; box-sizing: border-box; width: 100%;">
  <button type="button" (click)="onCancel()" style="position: absolute; top: 16px; right: 16px; color: #94a3b8; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 50;">
    <mat-icon>close</mat-icon>
  </button>

  <h2 mat-dialog-title style="text-align: center; font-size: 1.25rem; font-weight: 500; color: #1e293b; margin-top: 0; margin-bottom: 24px; padding-top: 0;">Editar Mis Datos<br>Personales</h2>

  <mat-dialog-content style="padding: 0; overflow: visible; display: block;">
    <form #perfilForm="ngForm" id="perfilForm">
    <div style="margin-bottom: 10px; display: flex; flex-direction: column;">
      <label style="font-size: 0.875rem; font-weight: 500; color: #334155; margin-left: 8px; margin-bottom: 8px;">Nombre completo</label>
      <input type="text" name="nombre" [(ngModel)]="formData.nombre" required style="width: 100%; height: 44px; line-height: 44px; padding: 0 16px; background-color: #f1f5f9; border-radius: 9999px; border: none; outline: none; color: #334155; font-size: 0.875rem; box-sizing: border-box;" placeholder="Ingrese su nombre">
    </div>

    <div style="margin-bottom: 10px; display: flex; flex-direction: column;">
      <label style="font-size: 0.875rem; font-weight: 500; color: #334155; margin-left: 8px; margin-bottom: 8px;">Correo electrónico</label>
      <input type="email" name="correo" [(ngModel)]="formData.correo" required style="width: 100%; height: 44px; line-height: 44px; padding: 0 16px; background-color: #f1f5f9; border-radius: 9999px; border: none; outline: none; color: #334155; font-size: 0.875rem; box-sizing: border-box;" placeholder="Ingrese su correo electrónico">
    </div>

    <div style="margin-bottom: 10px; display: flex; flex-direction: column;">
      <label style="font-size: 0.875rem; font-weight: 500; color: #334155; margin-left: 8px; margin-bottom: 8px;">Teléfono</label>
      <input type="tel" name="telefono" [(ngModel)]="formData.telefono" #telefonoModel="ngModel" required pattern="[0-9]{10}" maxlength="10" style="width: 100%; height: 44px; line-height: 44px; padding: 0 16px; background-color: #f1f5f9; border-radius: 9999px; border: none; outline: none; color: #334155; font-size: 0.875rem; box-sizing: border-box;" placeholder="Ingrese su teléfono">
      <div *ngIf="telefonoModel.invalid && (telefonoModel.dirty || telefonoModel.touched)" style="color: #e3342f; font-size: 0.75rem; margin-top: 4px; margin-left: 8px;">
        Debe ingresar un teléfono válido de 10 dígitos.
      </div>
    </div>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions style="display: flex; justify-content: center; padding-top: 16px; padding-bottom: 8px; padding-left: 0; padding-right: 0;">
    <button mat-button style="background-color: #27AE60; color: white; border-radius: 9999px; padding: 8px 32px; font-size: 1rem; font-weight: 500; border: none; cursor: pointer; height: auto;" (click)="onSave()" [disabled]="perfilForm.invalid" [style.opacity]="perfilForm.invalid ? '0.5' : '1'">
      Guardar Cambios
    </button>
  </mat-dialog-actions>
</div>
