<div class="auth-page-container">
  <!-- Top Brand Header (Mockup style) -->
  <div class="auth-header-bar">
    <div class="flex items-center gap-3 text-white">
      <img src="/Logo&Name.png" alt="SIPF Logo" class="h-16 w-auto object-contain filter drop-shadow-md">
    </div>
  </div>

  <!-- Background decorative elements -->
  <div class="decorative-blob-1"></div>
  <div class="decorative-blob-2"></div>
  
  <div class="auth-content-area">
    <div class="card auth-card">
      <div class="text-center mb-8">
        <h2 class="auth-title">Cambio de Contraseña</h2>
        <p class="auth-subtitle">Ingresa tu nueva contraseña</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2" for="nuevaContrasena">Contraseña</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input id="nuevaContrasena" type="password" formControlName="nuevaContrasena" class="input-field pl-10 pr-10 bg-slate-50" placeholder="Ingresa tu nueva contraseña">
          </div>
          <div *ngIf="form.get('nuevaContrasena')?.invalid && form.get('nuevaContrasena')?.touched" class="text-rose-500 text-xs mt-1 font-medium">
            Mínimo 8 caracteres, mayúsculas, minúsculas, números y símbolos.
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2" for="confirmarContrasena">Repetir contraseña</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input id="confirmarContrasena" type="password" formControlName="confirmarContrasena" class="input-field pl-10 pr-10 bg-slate-50" placeholder="Repite tu nueva contraseña">
          </div>
          <div *ngIf="form.hasError('mismatch') && form.get('confirmarContrasena')?.touched" class="text-rose-500 text-xs mt-1 font-medium">
            Las contraseñas no coinciden
          </div>
        </div>

        <button type="submit" [disabled]="form.invalid || isLoading()" class="btn-primary w-full py-3 shadow-md">
          <span *ngIf="!isLoading()">Cambiar contraseña</span>
          <div *ngIf="isLoading()" class="spinner"></div>
        </button>
      </form>
      
      <div class="mt-8 text-center">
        <a routerLink="/login" class="back-link">
          Volver al inicio de sesion
        </a>
      </div>
    </div>
  </div>
</div>
