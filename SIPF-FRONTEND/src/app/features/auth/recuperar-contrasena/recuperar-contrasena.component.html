<div class="auth-page-container">
  <!-- Top Brand Header (Mockup style) -->
  <div class="auth-header-bar">
    <div class="flex items-center gap-3 text-white">
      <img src="/Logo&Name.png" alt="SIPF Logo" class="h-16 w-auto object-contain filter drop-shadow-md">
    </div>
  </div>

  <!-- Background decorative elements -->
  <div class="decorative-blob-1"></div>
  <div class="decorative-blob-2"></div>
  
  <div class="auth-content-area">
    <div class="card auth-card">
      <div class="text-center mb-8">
        <h2 class="auth-title">Recuperar Contraseña</h2>
        <p class="auth-subtitle">Ingresa tu correo y te enviaremos instrucciones</p>
      </div>

      <div *ngIf="isSuccess()" class="success-alert">
        <svg class="success-alert-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <p class="success-alert-text">Instrucciones enviadas. Por favor revisa tu bandeja de entrada.</p>
      </div>

      <form *ngIf="!isSuccess()" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2" for="email">Correo electrónico</label>
          <input id="email" type="email" formControlName="correo" class="input-field bg-slate-50" placeholder="usuario@sena.edu.co">
          <div *ngIf="form.get('correo')?.invalid && form.get('correo')?.touched" class="text-rose-500 text-xs mt-1 font-medium">
            Ingresa un correo válido
          </div>
        </div>

        <button type="submit" [disabled]="form.invalid || isLoading()" class="btn-primary w-full py-3 shadow-md">
          <span *ngIf="!isLoading()">Enviar instrucciones</span>
          <div *ngIf="isLoading()" class="spinner"></div>
        </button>
      </form>

      <div class="mt-8 text-center">
        <a routerLink="/login" class="back-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Volver al inicio de sesión
        </a>
      </div>
    </div>
  </div>
</div>
