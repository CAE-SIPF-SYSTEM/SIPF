<div class="min-h-screen flex bg-[#f4f7f6]">
  <!-- Left side: Brand/Visual -->
  <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden bg-brand">
    <!-- Animated Background Gradients using brand colors -->
    <div class="absolute -top-[30%] -left-[10%] w-[70%] h-[70%] rounded-full bg-white/10 blur-[100px] animate-pulse-glow"></div>
    <div class="absolute bottom-[10%] -right-[20%] w-[60%] h-[60%] rounded-full bg-[#37CD2D]/20 blur-[120px] animate-pulse-glow" style="animation-delay: 1s"></div>
    
    <!-- Content -->
    <div class="relative z-10 w-full flex flex-col justify-center items-center p-12 text-center animate-fade-in">
      <div class=" w-25 h-25 px-10 py-10 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 flex flex-col items-center justify-center mb-8 shadow-xl animate-float max-w-sm">
        <img src="/Logo.png" alt="SIPF Logo" class="h-25 w-auto object-contain">
      </div>
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-6 tracking-tight leading-tight">
        Sistema de programación académica
      </h1>
      <p class="text-lg md:text-xl text-[#d1e9e5] font-light max-w-lg leading-relaxed">
      </p>
    </div>
  </div>

  <!-- Right side: Login Form -->
  <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 relative">
    <div class="w-full max-w-md animate-slide-in-right card relative z-10">
      
      <!-- Mobile Logo -->
      <div class="lg:hidden text-center mb-8 flex flex-col items-center">
        <img src="/Logo&Name.png" alt="SIPF Logo" class="h-20 w-auto object-contain mb-4 filter drop-shadow-sm">
      </div>
      
      <div class="text-center mb-10">
        <h2 class="text-3xl font-bold text-brand mb-2">INICIAR SESIÓN</h2>
        <p class="text-[#64748b]">Ingresa tus credenciales para continuar</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Email -->
        <div>
          <label class="block text-sm font-semibold text-[#334155] mb-2" for="email">Cédula (CC) o Correo Electrónico</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-[#94a3b8]">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <input id="email" type="text" formControlName="correo" class="input-field login-input bg-[#f8fafc]" placeholder="Ingrese número de cédula o correo electrónico" autocomplete="email">
          </div>
          <div *ngIf="loginForm.get('correo')?.invalid && loginForm.get('correo')?.touched" class="text-rose-500 text-xs mt-1 font-medium">
            Dato requerido
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-sm font-semibold text-[#334155]" for="password">Contraseña</label>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-[#94a3b8]">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="contrasena" class="input-field login-input pr-10 bg-[#f8fafc]" placeholder="Ingrese su contraseña" autocomplete="current-password">
            <button type="button" (click)="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-[#94a3b8] hover:text-brand focus:outline-none transition-colors">
              <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
            </button>
          </div>
          <div class="text-right mt-2">
            <a routerLink="/recuperar-contrasena" class="text-sm font-medium text-[#94a3b8] hover:text-brand transition-colors">Olvidé mi contraseña</a>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="loginForm.invalid || isLoading()" class="btn-primary w-full py-3 text-lg mt-8 shadow-md">
          <span *ngIf="!isLoading()">Iniciar Sesión</span>
          <div *ngIf="isLoading()" class="spinner"></div>
        </button>
      </form>
    </div>
    
    <!-- Decorative blobs in background of form -->
    <div class="absolute top-10 right-10 w-32 h-32 bg-[#37CD2D] rounded-full blur-[80px] opacity-20 pointer-events-none"></div>
    <div class="absolute bottom-10 left-10 w-40 h-40 bg-[#136E61] rounded-full blur-[80px] opacity-10 pointer-events-none"></div>
  </div>
</div>
