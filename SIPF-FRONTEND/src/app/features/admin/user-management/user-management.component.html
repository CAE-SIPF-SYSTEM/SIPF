<app-main-layout pageTitle="Gestión de Usuarios">
  
  <div class="bg-white rounded-2xl p-6 shadow-sm min-h-[80vh]">
    
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 animate-fade-in border-b border-slate-100 pb-4">
      
      <div class="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
        <h3 class="text-lg font-medium text-slate-800 mr-4 whitespace-nowrap">Administracion de usuarios</h3>

        <div class="relative w-full sm:w-48">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </div>
          <input type="number" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" class="admin-search-input" placeholder="Buscar por CC">
        </div>
        
        <select [ngModel]="selectedRole()" (ngModelChange)="selectedRole.set($event)" class="admin-select">
          <option value="TODOS">Filtrar por Rol</option>
          <option value="ADMINISTRADOR">Administrador</option>
          <option value="INSTRUCTOR">Instructor</option>
          <option value="COORDINADOR">Coordinador</option>
        </select>

        <select [ngModel]="selectedEstado()" (ngModelChange)="selectedEstado.set($event)" class="admin-select">
          <option value="TODOS">Filtrar por Estado</option>
          <option value="ACTIVO">Activo</option>
          <option value="INACTIVO">Inactivo</option>
        </select>
      </div>

      <button (click)="openCreateModal()" class="btn-primary px-6 rounded-full shadow-md shrink-0 w-full md:w-auto">
        Crear usuario
      </button>
    </div>

    <div class="overflow-hidden animate-fade-in-up">
      
      <div *ngIf="isLoading()" class="flex justify-center py-12">
        <div class="admin-spinner"></div>
      </div>

      <div *ngIf="!isLoading() && filteredUsers().length === 0" class="text-center py-12 text-slate-400">
        <svg class="w-12 h-12 mx-auto text-slate-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <p>No se encontraron usuarios</p>
      </div>

      <div *ngIf="!isLoading() && filteredUsers().length > 0" class="overflow-x-auto pb-8">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="table-header">
              <th class="py-3 px-4 font-semibold text-sm w-12 rounded-tl-xl text-center"></th>
              <th class="py-3 px-4 font-semibold text-sm">CC</th>
              <th class="py-3 px-4 font-semibold text-sm">Nombre</th>
              <th class="py-3 px-4 font-semibold text-sm">Correo</th>
              <th class="py-3 px-4 font-semibold text-sm">Rol</th>
              <th class="py-3 px-4 font-semibold text-sm rounded-tr-xl">Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of filteredUsers()" 
                (click)="openEditModal(user)" 
                class="hover:bg-slate-50 cursor-pointer transition-colors border-b border-slate-100 group">
              <td class="py-4 px-4 text-center">
                <input type="checkbox" class="admin-checkbox" (click)="$event.stopPropagation()">
              </td>
              <td class="py-4 px-4 text-slate-500 text-sm font-medium">{{ user.documentoIdentidad || 'N/A' }}</td>
              <td class="py-4 px-4 text-slate-500 text-sm">{{ user.nombre || '' }} {{ user.apellido || '' }}</td>
              <td class="py-4 px-4 text-slate-500 text-sm">{{ user.correo }}</td>
              <td class="py-4 px-4 text-slate-500 text-sm capitalize">{{ user.rol?.toLowerCase() }}</td>
              <td class="py-4 px-4 text-sm">
                <div class="flex items-center gap-2">
                  <span class="text-slate-500 font-medium w-16">{{ user.estado ? 'Activo' : 'Inactivo' }}</span>
                  <div class="status-indicator" [ngClass]="user.estado ? 'bg-active' : 'bg-inactive'"></div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Create Modal -->
  <div *ngIf="showCreateModal()" class="fixed inset-0 z-[60] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px] transition-opacity" (click)="closeModals()"></div>
    <div class="relative bg-white rounded-[24px] shadow-2xl w-full max-w-lg overflow-hidden animate-fade-in-up">
      
      <div class="flex justify-between items-center px-8 py-5 border-b border-slate-100">
        <h3 class="modal-header-title">Crear Usuario</h3>
        <button (click)="closeModals()" class="modal-close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      
      <form [formGroup]="createForm" (ngSubmit)="onCreateSubmit()" class="p-8 space-y-5">
        <div>
          <label class="modal-field-label">Nombre completo</label>
          <input type="text" formControlName="nombreCompleto" class="admin-modal-input" placeholder="Ingrese el nombre completo">
        </div>
        
        <div>
          <label class="modal-field-label">CC</label>
          <input type="number" formControlName="documentoIdentidad" class="admin-modal-input" placeholder="Ingrese el numero de cedula">
        </div>

        <div>
          <label class="modal-field-label">Correo electronico</label>
          <input type="email" formControlName="correo" class="admin-modal-input" placeholder="Ingrese el correo electronico">
        </div>

        <div>
          <label class="modal-field-label">Contraseña inicial</label>
          <input type="password" formControlName="contrasena" class="admin-modal-input" placeholder="Ingrese una contraseña temporal">
        </div>

        <div>
          <label class="modal-field-label">Telefono</label>
          <input type="number" formControlName="telefono" class="admin-modal-input" placeholder="Ingrese el numero de telefono">
        </div>

        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="modal-field-label">Rol</label>
            <div class="relative">
              <select formControlName="rol" class="admin-modal-select">
                <option value="" disabled selected>Seleccionar</option>
                <option value="ADMINISTRADOR">Administrador</option>
                <option value="INSTRUCTOR">Instructor</option>
                <option value="COORDINADOR">Coordinador</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </div>
          </div>
          <div>
            <label class="modal-field-label">Estado</label>
            <div class="relative">
              <select formControlName="estado" class="admin-modal-select">
                <option [ngValue]="true">Activo</option>
                <option [ngValue]="false">Inactivo</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </div>
          </div>
        </div>
        
        <div class="mt-8 flex justify-center pt-2">
          <button type="submit" [disabled]="createForm.invalid || isSaving()" class="btn-primary py-2.5 px-10 rounded-full shadow-md">
            <span *ngIf="!isSaving()">Guardar Cambios</span>
            <div *ngIf="isSaving()" class="spinner w-5 h-5 mx-8 border-t-white"></div>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Modal -->
  <div *ngIf="showEditModal()" class="fixed inset-0 z-[60] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px] transition-opacity" (click)="closeModals()"></div>
    <div class="relative bg-white rounded-[24px] shadow-2xl w-full max-w-lg overflow-hidden animate-fade-in-up">
      
      <div class="flex justify-between items-center px-8 py-5 border-b border-slate-100">
        <h3 class="modal-header-title">Editar Usuario</h3>
        <button (click)="closeModals()" class="modal-close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      
      <form [formGroup]="editForm" (ngSubmit)="onEditSubmit()" class="p-8 space-y-5">
        <div>
          <label class="modal-field-label">Correo electronico</label>
          <input type="email" formControlName="correo" class="admin-modal-input">
        </div>
        
        <div>
          <label class="modal-field-label">Cambiar Contraseña (Opcional)</label>
          <input type="password" formControlName="contrasena" class="admin-modal-input" placeholder="Dejar en blanco para conservar actual">
        </div>

        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="modal-field-label">Rol</label>
            <div class="relative">
              <select formControlName="rol" class="admin-modal-select">
                <option value="ADMINISTRADOR">Administrador</option>
                <option value="INSTRUCTOR">Instructor</option>
                <option value="COORDINADOR">Coordinador</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </div>
          </div>
          <div>
            <label class="modal-field-label">Estado</label>
            <div class="relative">
              <select formControlName="estado" class="admin-modal-select">
                <option [ngValue]="true">Activo</option>
                <option [ngValue]="false">Inactivo</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-8 flex flex-col items-center gap-4 pt-2">
          <button type="submit" [disabled]="editForm.invalid || isSaving()" class="btn-primary py-2.5 px-10 rounded-full shadow-md">
            <span *ngIf="!isSaving()">Guardar Cambios</span>
            <div *ngIf="isSaving()" class="spinner w-5 h-5 mx-8 border-t-white"></div>
          </button>
          
          <button type="button" (click)="openDeleteModal(selectedUser()!)" class="delete-user-link">
            Eliminar usuario permanentemente
          </button>
        </div>
      </form>
    </div>
  </div>

  <app-confirm-modal
    [isOpen]="showDeleteModal()"
    title="Eliminar Usuario"
    [message]="'¿Estás seguro de que deseas eliminar al usuario ' + (selectedUser()?.correo || '') + '? Esta acción no se puede deshacer.'"
    confirmText="Eliminar"
    type="danger"
    (confirmed)="onDeleteConfirm()"
    (cancelled)="closeModals()">
  </app-confirm-modal>

</app-main-layout>
