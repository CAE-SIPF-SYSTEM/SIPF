<h2 mat-dialog-title class="!text-lg !font-bold !text-slate-800 pb-2 border-b border-slate-100">
  {{ data.isEdit ? 'Cambiar Especialidad' : 'Asignar Especialidad' }}
</h2>
<mat-dialog-content class="pt-6">
  <p class="text-sm text-slate-500 mb-6">
    Selecciona la especialidad que deseas asignar al instructor <span class="font-semibold text-slate-700">{{ data.instructor.nombre }} {{ data.instructor.apellido }}</span>.
  </p>

  <form [formGroup]="form" class="flex flex-col gap-4">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Especialidad</mat-label>
      <mat-select formControlName="especialidadId">
        <mat-option *ngFor="let esp of data.especialidades" [value]="esp.id">
          {{ esp.nombreEspecialidad }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('especialidadId')?.hasError('required')">
        La especialidad es requerida
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end" class="!px-6 !pb-6 !pt-2">
  <button mat-button mat-dialog-close class="!text-slate-500">Cancelar</button>
  <button mat-flat-button color="primary" class="!bg-[#37CD2D] !text-white !rounded-full !px-6"
          [disabled]="form.invalid" (click)="save()">
    Guardar
  </button>
</mat-dialog-actions>
