<app-main-layout pageTitle="Asignación de Especialidades">
  <div class="max-w-7xl mx-auto px-6 pt-12 pb-12 w-full flex flex-col gap-6 animate-fade-in-up">
    
    <!-- Header -->
    <div class="flex justify-between items-center bg-white shadow-sm rounded-t-2xl p-6 border-b border-slate-100">
      <h2 class="text-lg font-bold text-slate-800 m-0">Instructores y Especialidades</h2>
    </div>

    <!-- Table Container -->
    <div class="bg-white rounded-b-2xl shadow-sm overflow-hidden p-6 -mt-2">
      <div class="overflow-x-auto">
        <table mat-table [dataSource]="instructoresDataSource()" class="w-full text-sm">
          
          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="!bg-[#136E61] !text-white font-medium px-4 py-3 text-left rounded-tl-lg"> ID </th>
            <td mat-cell *matCellDef="let element" class="px-4 py-3 text-slate-500"> {{element.id}} </td>
          </ng-container>

          <!-- Nombre Column -->
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef class="!bg-[#136E61] !text-white font-medium px-4 py-3 text-left"> Instructor </th>
            <td mat-cell *matCellDef="let element" class="px-4 py-3 text-slate-500 font-medium"> {{element.nombre}} {{element.apellido}} </td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="correo">
            <th mat-header-cell *matHeaderCellDef class="!bg-[#136E61] !text-white font-medium px-4 py-3 text-left"> Correo </th>
            <td mat-cell *matCellDef="let element" class="px-4 py-3 text-slate-500"> {{element.correo}} </td>
          </ng-container>

          <!-- Especialidad Actual Column -->
          <ng-container matColumnDef="especialidad">
            <th mat-header-cell *matHeaderCellDef class="!bg-[#136E61] !text-white font-medium px-4 py-3 text-left"> Especialidad Asignada </th>
            <td mat-cell *matCellDef="let element" class="px-4 py-3">
              <span *ngIf="getEspecialidadNombre(element.id)" class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold">
                {{ getEspecialidadNombre(element.id) }}
              </span>
              <span *ngIf="!getEspecialidadNombre(element.id)" class="px-3 py-1 bg-slate-100 text-slate-500 rounded-full text-xs">
                Sin asignar
              </span>
            </td>
          </ng-container>

          <!-- Acciones Column -->
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef class="!bg-[#136E61] !text-white font-medium px-4 py-3 text-right rounded-tr-lg"> Acciones </th>
            <td mat-cell *matCellDef="let element" class="px-4 py-3 text-right">
              
              <button *ngIf="!getEspecialidadNombre(element.id)" mat-flat-button class="rounded-full px-4 h-8 text-xs bg-[#37CD2D] text-white font-medium shadow-sm hover:shadow transition-all mr-2" (click)="openDialog(element, false)">
                Asignar
              </button>
              
              <button *ngIf="getEspecialidadNombre(element.id)" mat-flat-button class="rounded-full px-4 h-8 text-xs bg-amber-500 text-white font-medium shadow-sm hover:shadow transition-all mr-2" (click)="openDialog(element, true)">
                Cambiar
              </button>

              <button *ngIf="getEspecialidadNombre(element.id)" mat-icon-button class="text-slate-500 hover:text-red-600" (click)="unassign(element.id)" title="Quitar Especialidad">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns" class="h-12 !bg-[#136E61]"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-slate-50 transition-colors border-b border-slate-100 h-12"></tr>
        </table>
        
        <div *ngIf="instructoresDataSource().length === 0" class="p-8 text-center text-slate-500">
          No hay instructores registrados en el sistema.
        </div>
      </div>
    </div>
  </div>
</app-main-layout>
