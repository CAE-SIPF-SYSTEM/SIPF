<app-main-layout pageTitle="Gestión de Competencias">
  <div class="w-full px-6 pt-12 pb-12 flex flex-col gap-6 animate-fade-in-up">
    
    <!-- Filter bar -->
    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center bg-white shadow-sm rounded-t-2xl p-6 border-b border-slate-100 gap-4">
      <div class="flex flex-col sm:flex-row flex-wrap items-start sm:items-center gap-4 w-full lg:w-auto">
        <h2 class="text-lg font-bold text-slate-800 m-0">Competencias</h2>
        
        <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto mt-2 sm:mt-0">
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full sm:w-64 text-sm">
            <mat-icon matPrefix class="scale-75 opacity-70">search</mat-icon>
            <input matInput [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" placeholder="Buscar por nombre...">
          </mat-form-field>
          
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full sm:w-48 text-sm">
            <mat-select [ngModel]="selectedTipo()" (ngModelChange)="selectedTipo.set($event)">
              <mat-option value="TODOS">Todos los tipos</mat-option>
              <mat-option value="TRANSVERSAL">Transversal</mat-option>
              <mat-option value="TECNICA">Tecnica</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

      
    </div>

    <!-- Table Container -->
    <div class="bg-white rounded-b-2xl shadow-sm overflow-hidden p-6 -mt-2">
      <div *ngIf="isLoading()" class="flex justify-center py-12">
        <div class="spinner border-t-primary-600"></div>
      </div>

      <div *ngIf="!isLoading()" class="overflow-x-auto">
        <table mat-table [dataSource]="dataSource" class="w-full text-sm">
          
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="!bg-[#136E61] !text-white font-medium px-4 py-3 text-left rounded-tl-lg w-20"> ID </th>
            <td mat-cell *matCellDef="let element" class="px-4 py-3 text-slate-500 font-medium"> {{element.id}} </td>
          </ng-container>

          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef class="!bg-[#136E61] !text-white font-medium px-4 py-3 text-left w-auto"> Nombre de Competencia </th>
            <td mat-cell *matCellDef="let element" class="px-4 py-3 text-slate-800 font-medium"> {{element.nombre}} </td>
          </ng-container>

          <ng-container matColumnDef="tipoCompetencia">
            <th mat-header-cell *matHeaderCellDef class="!bg-[#136E61] !text-white font-medium px-4 py-3 text-center rounded-tr-lg w-48"> Tipo </th>
            <td mat-cell *matCellDef="let element" class="px-4 py-1 text-center"> 
              <span class="px-3 py-1 rounded-full text-xs font-semibold shadow-sm border"
                    [ngClass]="{
                      'bg-emerald-50 text-emerald-700 border-emerald-200': element.tipoCompetencia === 'TECNICA',
                      'bg-indigo-50 text-indigo-700 border-indigo-200': element.tipoCompetencia === 'TRANSVERSAL'
                    }">
                {{element.tipoCompetencia === 'TECNICA' ? 'Técnica' : 'Transversal'}}
              </span>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="!bg-[#136E61] h-12"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-slate-50 transition-colors border-b border-slate-100 h-12"></tr>
          
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center py-12 text-slate-500" colspan="4">
              No se encontraron competencias.
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator [pageSize]="10" [hidePageSize]="true" class="border-t border-slate-100 mt-4"></mat-paginator>
    </div>
  </div>
</app-main-layout>
