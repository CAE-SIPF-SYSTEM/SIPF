<h2 mat-dialog-title class="!text-xl font-bold text-slate-800 flex items-center gap-2">
  <mat-icon class="text-[#37CD2D]">assignment_turned_in</mat-icon>
  Crear Nuevo RAP
</h2>

<mat-dialog-content class="!pb-6">
  <p class="text-slate-500 mb-6 text-sm">Registra un nuevo Resultado de Aprendizaje y asócialo a una competencia.</p>

  <form class="flex flex-col gap-4">
    
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Competencia Asociada</mat-label>
      <mat-select [(ngModel)]="nuevoRap.competenciaId" name="competenciaId" required>
        <mat-option [value]="0" disabled>Selecciona una Competencia...</mat-option>
        <mat-option *ngFor="let c of competencias" [value]="c.id">{{ c.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Descripción del RAP</mat-label>
      <textarea matInput [(ngModel)]="nuevoRap.descripcion" name="descripcion" placeholder="Ej. Comprender los fundamentos de la programación orientada a objetos" rows="3" required></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Horas Presenciales</mat-label>
      <input matInput type="number" [(ngModel)]="nuevoRap.horasPresenciales" name="horasPresenciales" placeholder="Ej. 40" required min="1">
      <span matTextSuffix class="mr-2 opacity-70">hrs</span>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="!px-6 !pb-6">
  <button mat-button color="warn" (click)="onCancel()" [disabled]="isSubmitting" class="rounded-full px-6">
    Cancelar
  </button>
  <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="isSubmitting" class="rounded-full px-6 bg-[#37CD2D] text-white">
    {{ isSubmitting ? 'Guardando...' : 'Guardar RAP' }}
  </button>
</mat-dialog-actions>
