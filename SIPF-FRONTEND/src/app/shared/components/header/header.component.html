<header class="header-bar">
  <h1 class="text-xl font-semibold animate-fade-in">{{ title() }}</h1>
  
  <div class="flex items-center gap-4">
    <div class="user-badge-container">
      <span class="text-sm font-medium">{{ email }}</span>
      <span class="badge" [ngClass]="badgeClass">{{ role }}</span>
    </div>
    <button class="avatar-circle cursor-pointer hover:bg-white/30 transition-colors focus:outline-none focus:ring-2 focus:ring-white/50" [matMenuTriggerFor]="profileMenu">
      {{ initial }}
    </button>

    <mat-menu #profileMenu="matMenu">
      <button mat-menu-item (click)="goToProfile()">
        <mat-icon>person</mat-icon>
        <span>Editar Perfil</span>
      </button>
    </mat-menu>
  </div>
</header>
